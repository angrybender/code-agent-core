{% if agent_commands %}
<p><strong>Available shell commands:</strong></p>
<table>
  <thead><tr><th>Command</th><th>Shell</th><th>Available&nbsp;to</th></tr></thead>
  <tbody>
  {% for c in agent_commands %}
  <tr>
    <td><strong>{{ c.command }}</strong></td>
    <td><code>{{ c.cmd }}</code></td>
    <td>{{ "CODER" if c.config.get("side_effects") else "<i>all</i>" }}</td>
  </tr>
  {% endfor %}
  </tbody>
</table>
{% endif %}
