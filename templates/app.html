<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent0.7</title>

    <script>
    {% include 'assets/markdown.js' %}
    </script>

    <style>
    {% include 'assets/main.css' %}
    </style>

    <script>
        var SESSION_ID = "{{ app.session_id }}";
    </script>
</head>
<body>
    <div id="main-wrapper">
        <div class="chat-container">
            <div id="chat-messages" class="chat-messages"></div>

            <div class="input-container">
                <div id="image-preview-container"></div>
                <textarea
                    id="message-input"
                    class="message-input"
                    placeholder="Type your message here... (Press Ctrl+Enter to send)"
                    rows="4"
                ></textarea>
                <div class="input-toolbar">
                    <button id="upload-image-btn" class="default upload-image-btn" type="button">📎 Image</button>
                </div>
            </div>
        </div>

        <div id="context-window-bar">
            <div class="context-bar-fill"></div>
            <span class="context-bar-label"></span>
        </div>
    </div>

    <button class="default" id="control-flow-stop">
        <span class="spinner-component"></span>
        <span>STOP</span>
        <span class="dummy"></span>
    </button>

    <input type="file" id="image-upload-input" accept="image/*" style="display:none">

    <script>
        {% include 'assets/app.js' %}
    </script>
</body>
</html>
