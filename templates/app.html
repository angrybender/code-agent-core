<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent0.7</title>

    <script>
    {% include 'assets/markdown.js' %}
    </script>

    <style>
    {% include 'assets/main.css' %}
    </style>

    <script>
        var SESSION_ID = "{{ app.session_id }}";
    </script>
</head>
<body>
    <div id="main-wrapper">
        <div class="chat-container">
            <div id="chat-messages" class="chat-messages"></div>

            <div class="input-container">
                <div class="input-toolbar">
                    <input type="file" id="image-upload-input" accept="image/jpeg,image/png,image/gif,image/webp,image/bmp" style="display:none">
                    <label for="image-upload-input" class="image-upload-btn" id="image-upload-btn" title="Attach image">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                    </label>
                    <div id="image-preview-container" style="display:none">
                        <img id="image-preview-thumb" alt="preview">
                        <button id="image-remove-btn" title="Remove image">✕</button>
                    </div>
                </div>
                <textarea
                    id="message-input"
                    class="message-input"
                    placeholder="Type your message here... (Press Ctrl+Enter to send)"
                    rows="4"
                ></textarea>
            </div>
        </div>
    </div>

    <button class="default" id="control-flow-stop">
        <span class="spinner-component"></span>
        <span>STOP</span>
        <span class="dummy"></span>
    </button>

    <script>
        {% include 'assets/app.js' %}
    </script>
</body>
</html>
